[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csrp-paper-skill-mvp"
version = "0.3.0.dev0"
description = "Provenance-preserving Paper-as-Skill architecture and evidence-family benchmark prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.2",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/turboguan/csrp-paper-skills"
Issues = "https://github.com/turboguan/csrp-paper-skills/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
