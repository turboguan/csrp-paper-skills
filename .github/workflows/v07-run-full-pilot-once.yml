name: v0.7 one-time full Means pilot

on:
  push:
    branches:
      - research/v0.7-openai-gpt61sol-pilot

permissions:
  contents: read

jobs:
  full-pilot:
    if: ${{ contains(github.event.head_commit.message, '[RUN_FULL_PILOT]') }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CSRP_REAL_LLM_CONFIRM: "1"
      CSRP_ADAPTER_FACTORY: "csrp_skills.providers.openai_responses:create_frozen_means_pilot_adapter"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pilot dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,openai]'

      - name: Run unit tests before paid calls
        run: pytest -q

      - name: Verify credential and frozen model
        run: python scripts/v07_openai_smoke.py

      - name: Run full 18-question x 3-architecture x 3-replicate pilot
        run: python scripts/v06_means_pilot_real.py

      - name: Upload pilot outputs and checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v07-real-means-pilot
          path: outputs/pilot/
          if-no-files-found: warn
