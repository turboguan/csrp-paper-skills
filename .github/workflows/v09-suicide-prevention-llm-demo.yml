name: v0.9 suicide-prevention live LLM demo

on:
  workflow_dispatch:
    inputs:
      confirm_paid_run:
        description: "I understand this makes paid OpenAI API calls"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-demo:
    if: ${{ inputs.confirm_paid_run }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CSRP_REAL_LLM_CONFIRM: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,openai]'

      - name: Run unit tests
        run: pytest -q

      - name: Verify credential and model access
        run: python scripts/v07_openai_smoke.py

      - name: Run six-question suicide-prevention LLM demo
        run: python scripts/v09_suicide_prevention_llm_demo.py

      - name: Upload outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v09-suicide-prevention-llm-demo
          path: outputs/virtual_csrp/
          if-no-files-found: warn
