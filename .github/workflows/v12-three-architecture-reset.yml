name: v1.2 three-architecture reset

on:
  push:
    branches:
      - research/v1.2-three-architecture-reset
  pull_request:
    branches:
      - research/v1.1-minimal-virtual-csrp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run full unit test suite
        run: pytest -q
      - name: Run revised 36-cell deterministic pilot
        run: python scripts/v12_mini_pilot_dry_run.py
