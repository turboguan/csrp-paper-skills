name: v1.0 pre-pilot freeze and 36-cell checks

on:
  push:
    branches:
      - research/v1.0-theory-mini-pilot
  pull_request:
    branches:
      - freeze/virtual-csrp-prepilot-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepilot-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run full unit test suite
        run: pytest -q

      - name: Run deterministic 36-cell pipeline check
        run: python scripts/v10_mini_pilot_dry_run.py

      - name: Upload dry-run output
        uses: actions/upload-artifact@v4
        with:
          name: v10-36cell-mini-pilot-dry-run
          path: outputs/local/v10_36cell_mini_pilot_dry_run.json
