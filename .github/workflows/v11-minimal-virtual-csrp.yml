name: v1.1 minimal Virtual CSRP

on:
  push:
    branches:
      - research/v1.1-minimal-virtual-csrp
  pull_request:
    branches:
      - research/v1.0-theory-mini-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimal-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: pytest -q
      - name: Run minimal Virtual CSRP dry run
        run: python scripts/v11_minimal_virtual_csrp_dry_run.py
