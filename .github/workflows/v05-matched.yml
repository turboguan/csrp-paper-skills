name: v0.5 matched LLM scaffold

on:
  push:
    branches:
      - research/v0.5-matched-llm-adapter
  pull_request:
    branches:
      - research/v0.4-organizational-designs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: pytest -q
      - name: Run matched LLM dry run
        run: python scripts/v05_matched_llm_dry_run.py
      - name: Upload dry-run output
        uses: actions/upload-artifact@v4
        with:
          name: v05-matched-llm-scaffold
          path: outputs/local/v05_matched_llm_dry_run.json
