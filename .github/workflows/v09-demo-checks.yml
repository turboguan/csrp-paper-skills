name: v0.9 suicide-prevention demo checks

on:
  push:
    branches:
      - research/v0.9-suicide-prevention-llm-demo
  pull_request:
    branches:
      - research/v0.8-virtual-csrp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run unit tests
        run: pytest -q
