name: v0.7 real OpenAI means pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run only credential/model smoke test or the full paid pilot"
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full_pilot
      confirm_paid_run:
        description: "I understand this workflow makes paid OpenAI API calls"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  real-openai-pilot:
    if: ${{ inputs.confirm_paid_run }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CSRP_REAL_LLM_CONFIRM: "1"
      CSRP_ADAPTER_FACTORY: "csrp_skills.providers.openai_responses:create_frozen_means_pilot_adapter"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pilot dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,openai]'

      - name: Verify API credential and frozen model
        run: python scripts/v07_openai_smoke.py

      - name: Run full 18-question pilot
        if: ${{ inputs.mode == 'full_pilot' }}
        run: python scripts/v06_means_pilot_real.py

      - name: Upload real pilot outputs
        if: ${{ inputs.mode == 'full_pilot' }}
        uses: actions/upload-artifact@v4
        with:
          name: v07-real-means-pilot
          path: outputs/pilot/
