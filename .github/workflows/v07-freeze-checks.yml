name: v0.7 OpenAI pilot freeze checks

on:
  push:
    branches:
      - research/v0.7-openai-gpt61sol-pilot
  pull_request:
    branches:
      - research/v0.6-means-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Validate 18-question dry-run pipeline
        run: python scripts/v06_means_pilot_dry_run.py
