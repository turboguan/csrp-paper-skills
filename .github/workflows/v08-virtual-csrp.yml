name: v0.8 Virtual CSRP scaffold

on:
  push:
    branches:
      - research/v0.8-virtual-csrp
  pull_request:
    branches:
      - research/v0.7-openai-gpt61sol-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-csrp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: pytest -q

      - name: Run Virtual CSRP architecture demo
        run: python scripts/v08_virtual_csrp_demo.py
