name: v1.3 three-architecture flagship

on:
  push:
    branches:
      - research/v1.3-three-architecture-flagship
  pull_request:
    branches:
      - research/v1.2-three-architecture-reset
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flagship-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run full unit tests
        run: pytest -q
      - name: Run deterministic three-architecture flagship
        run: python scripts/v13_flagship_three_architectures_dry_run.py
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v13-three-architecture-flagship-dry-run
          path: |
            outputs/local/v13_flagship_three_architectures_dry_run.json
            outputs/local/v13_flagship_blinded_review.csv
            outputs/local/v13_flagship_blinding_key.csv
