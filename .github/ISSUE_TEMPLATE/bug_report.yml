name: Bug report
description: Report a reproducible defect in the prototype
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include command, query, input file, and minimal steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.2.0 or commit SHA
  - type: textarea
    id: safety
    attributes:
      label: Safety or provenance impact
      description: Note whether this could affect evidence provenance, clinical interpretation, or safety behavior.
