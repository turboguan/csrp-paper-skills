name: Feature request
description: Propose a research or engineering improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research or engineering problem
      description: What limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest testable implementation.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How should it be evaluated?
      description: Define success criteria, benchmark hooks, or ablations.
