<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">Paper-as-Skill architecture</title>
<desc id="desc">Scientific papers are compiled into shared skills and an evidence graph, then used by a small set of reasoning agents before evidence and safety review.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#5c6b72"/>
  </marker>
  <style>
    .box{fill:#ffffff;stroke:#32454e;stroke-width:2.4}
    .soft{fill:#f4f8f8;stroke:#6d7d83;stroke-width:2}
    .accent{fill:#edf7f5;stroke:#2a7f78;stroke-width:2.6}
    .head{font:700 24px Inter,Arial,sans-serif;fill:#18262d}
    .label{font:600 18px Inter,Arial,sans-serif;fill:#253740}
    .small{font:15px Inter,Arial,sans-serif;fill:#56666d}
    .tiny{font:13px Inter,Arial,sans-serif;fill:#66767c}
    .flow{stroke:#5c6b72;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="760" fill="#ffffff"/>
<text x="58" y="54" class="head">From paper agents to shared paper skills</text>
<text x="58" y="84" class="small">Papers provide evidence and capabilities; agents provide reasoning and coordination.</text>

<rect x="55" y="145" width="180" height="120" rx="14" class="soft"/>
<text x="145" y="187" text-anchor="middle" class="label">CSRP papers</text>
<text x="145" y="216" text-anchor="middle" class="small">PDF · metadata</text>
<text x="145" y="239" text-anchor="middle" class="small">supplements · code</text>

<rect x="295" y="125" width="230" height="160" rx="14" class="box"/>
<text x="410" y="168" text-anchor="middle" class="label">Paper-to-Skill</text>
<text x="410" y="193" text-anchor="middle" class="label">Factory</text>
<text x="410" y="225" text-anchor="middle" class="small">parse · extract · validate</text>
<text x="410" y="248" text-anchor="middle" class="small">anchor provenance</text>

<rect x="585" y="105" width="280" height="200" rx="14" class="accent"/>
<text x="725" y="146" text-anchor="middle" class="label">Shared Paper Skill Registry</text>
<text x="618" y="181" class="small">• Evidence Card</text>
<text x="618" y="207" class="small">• Claims + source spans</text>
<text x="618" y="233" class="small">• Resources + tools</text>
<text x="618" y="259" class="small">• Boundaries + provenance</text>

<rect x="585" y="365" width="280" height="190" rx="14" class="soft"/>
<text x="725" y="405" text-anchor="middle" class="label">Shared Evidence Graph</text>
<text x="620" y="442" class="small">Paper ↔ Claim ↔ Population</text>
<text x="620" y="468" class="small">Intervention ↔ Outcome ↔ Method</text>
<text x="620" y="500" class="small">SUPPORTS · CONTRADICTS</text>
<text x="620" y="526" class="small">QUALIFIES · NOT_COMPARABLE</text>

<rect x="935" y="145" width="245" height="420" rx="16" class="box"/>
<text x="1058" y="185" text-anchor="middle" class="label">Few persistent</text>
<text x="1058" y="211" text-anchor="middle" class="label">Domain Agents</text>
<rect x="975" y="245" width="165" height="70" rx="12" class="accent"/>
<text x="1058" y="287" text-anchor="middle" class="label">Universal</text>
<rect x="975" y="335" width="165" height="70" rx="12" class="accent"/>
<text x="1058" y="377" text-anchor="middle" class="label">Selective</text>
<rect x="975" y="425" width="165" height="70" rx="12" class="accent"/>
<text x="1058" y="467" text-anchor="middle" class="label">Indicated</text>
<text x="1058" y="531" text-anchor="middle" class="tiny">shared reasoning workspace</text>

<rect x="1245" y="155" width="210" height="95" rx="14" class="accent"/>
<text x="1350" y="197" text-anchor="middle" class="label">Evidence Judge</text>
<text x="1350" y="223" text-anchor="middle" class="small">consistency · mismatch</text>

<rect x="1245" y="300" width="210" height="105" rx="14" class="accent"/>
<text x="1350" y="343" text-anchor="middle" class="label">Safety Supervisor</text>
<text x="1350" y="369" text-anchor="middle" class="small">allow · revise · abstain</text>
<text x="1350" y="392" text-anchor="middle" class="small">escalate</text>

<rect x="1245" y="465" width="210" height="115" rx="14" class="soft"/>
<text x="1350" y="501" text-anchor="middle" class="label">Outputs</text>
<text x="1350" y="530" text-anchor="middle" class="small">Research · Policy</text>
<text x="1350" y="554" text-anchor="middle" class="small">Practitioner · bounded support</text>

<line x1="235" y1="205" x2="295" y2="205" class="flow"/>
<line x1="525" y1="205" x2="585" y2="205" class="flow"/>
<line x1="725" y1="305" x2="725" y2="365" class="flow"/>
<line x1="865" y1="205" x2="935" y2="280" class="flow"/>
<line x1="865" y1="455" x2="935" y2="410" class="flow"/>
<line x1="1180" y1="280" x2="1245" y2="203" class="flow"/>
<line x1="1350" y1="250" x2="1350" y2="300" class="flow"/>
<line x1="1350" y1="405" x2="1350" y2="465" class="flow"/>

<rect x="55" y="625" width="1400" height="64" rx="12" fill="#f7f8f8" stroke="#c3cccf"/>
<text x="755" y="665" text-anchor="middle" class="small">Foundation: provenance · versioning · human oversight · privacy · safety</text>
<text x="58" y="726" class="tiny">Paper Skill ≠ Persistent Agent. Evidence is shared; agency is scarce.</text>
</svg>