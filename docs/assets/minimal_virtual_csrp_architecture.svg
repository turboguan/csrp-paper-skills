<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Minimal Virtual CSRP Architecture</title>
  <desc id="desc">Four core agents, shared institutional memory, and a non-agent quality and safety gate for suicide-prevention research workflows.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/>
    </marker>
    <style>
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#0F172A; }
      .subtitle { font: 400 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#475569; }
      .boxTitle { font: 700 23px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#0F172A; }
      .boxText { font: 400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#334155; }
      .small { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#475569; }
      .memoryTitle { font: 700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#0F172A; }
      .memoryText { font: 400 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#334155; }
      .pill { font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#0F172A; letter-spacing:.2px; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#F8FAFC"/>
  <rect x="40" y="30" width="1520" height="860" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>

  <text x="800" y="88" text-anchor="middle" class="title">Minimal Virtual CSRP</text>
  <text x="800" y="120" text-anchor="middle" class="subtitle">AI-native suicide-prevention research center: minimal agency, shared institutional knowledge</text>

  <!-- User task -->
  <g filter="url(#shadow)">
    <rect x="560" y="160" width="480" height="92" rx="20" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
  </g>
  <text x="800" y="195" text-anchor="middle" class="boxTitle">Research Question / Task</text>
  <text x="800" y="225" text-anchor="middle" class="boxText">research · data analysis · report · manuscript · policy decision</text>

  <!-- Coordinator -->
  <line x1="800" y1="252" x2="800" y2="292" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="535" y="305" width="530" height="118" rx="22" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/>
  </g>
  <rect x="565" y="324" width="125" height="28" rx="14" fill="#BAE6FD"/>
  <text x="628" y="344" text-anchor="middle" class="pill">CORE AGENT 1</text>
  <text x="800" y="373" text-anchor="middle" class="boxTitle">Research Coordinator Agent</text>
  <text x="800" y="402" text-anchor="middle" class="boxText">understand goal · decompose task · activate only needed capabilities</text>

  <!-- Middle two agents -->
  <line x1="800" y1="423" x2="800" y2="455" stroke="#334155" stroke-width="3"/>
  <line x1="800" y1="455" x2="505" y2="455" stroke="#334155" stroke-width="3"/>
  <line x1="800" y1="455" x2="1095" y2="455" stroke="#64748B" stroke-width="3" stroke-dasharray="10 9"/>
  <line x1="505" y1="455" x2="505" y2="480" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1095" y1="455" x2="1095" y2="480" stroke="#64748B" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrowSoft)"/>

  <g filter="url(#shadow)">
    <rect x="255" y="490" width="500" height="138" rx="22" fill="#ECFDF5" stroke="#86EFAC" stroke-width="2"/>
  </g>
  <rect x="285" y="510" width="125" height="28" rx="14" fill="#BBF7D0"/>
  <text x="348" y="530" text-anchor="middle" class="pill">CORE AGENT 2</text>
  <text x="505" y="562" text-anchor="middle" class="boxTitle">Evidence &amp; Data Agent</text>
  <text x="505" y="592" text-anchor="middle" class="boxText">retrieve papers · organize data · provenance · prior knowledge</text>
  <text x="505" y="616" text-anchor="middle" class="small">What do we already know, and what data do we have?</text>

  <g filter="url(#shadow)">
    <rect x="845" y="490" width="500" height="138" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  </g>
  <rect x="875" y="510" width="125" height="28" rx="14" fill="#FED7AA"/>
  <text x="938" y="530" text-anchor="middle" class="pill">CORE AGENT 3</text>
  <text x="1095" y="562" text-anchor="middle" class="boxTitle">Analysis &amp; Methods Agent</text>
  <text x="1095" y="592" text-anchor="middle" class="boxText">statistics · causal inference · spatial analysis · ML / NLP</text>
  <text x="1095" y="616" text-anchor="middle" class="small">Activated only when analysis is required</text>

  <!-- Shared memory -->
  <g filter="url(#shadow)">
    <rect x="70" y="292" width="345" height="166" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <text x="242" y="326" text-anchor="middle" class="memoryTitle">Shared Institutional Memory</text>
  <text x="98" y="357" class="memoryText">• Paper Skills</text>
  <text x="98" y="383" class="memoryText">• Evidence Graph</text>
  <text x="98" y="409" class="memoryText">• Provenance Registry</text>
  <text x="98" y="435" class="memoryText">• Datasets · analysis artifacts · prior outputs</text>
  <line x1="415" y1="358" x2="535" y2="358" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSoft)"/>
  <line x1="415" y1="400" x2="255" y2="540" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSoft)"/>
  <line x1="415" y1="418" x2="845" y2="540" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrowSoft)"/>

  <!-- Synthesis -->
  <line x1="505" y1="628" x2="505" y2="658" stroke="#334155" stroke-width="3"/>
  <line x1="1095" y1="628" x2="1095" y2="658" stroke="#64748B" stroke-width="3" stroke-dasharray="10 9"/>
  <line x1="505" y1="658" x2="800" y2="658" stroke="#334155" stroke-width="3"/>
  <line x1="1095" y1="658" x2="800" y2="658" stroke="#64748B" stroke-width="3" stroke-dasharray="10 9"/>
  <line x1="800" y1="658" x2="800" y2="682" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="535" y="692" width="530" height="118" rx="22" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="2"/>
  </g>
  <rect x="565" y="711" width="125" height="28" rx="14" fill="#E9D5FF"/>
  <text x="628" y="731" text-anchor="middle" class="pill">CORE AGENT 4</text>
  <text x="800" y="760" text-anchor="middle" class="boxTitle">Synthesis &amp; Decision Agent</text>
  <text x="800" y="789" text-anchor="middle" class="boxText">research synthesis · report · manuscript · policy memo</text>

  <!-- Quality and safety gate -->
  <line x1="1065" y1="752" x2="1188" y2="752" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1200" y="675" width="320" height="150" rx="22" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
  </g>
  <rect x="1230" y="695" width="102" height="28" rx="14" fill="#FECACA"/>
  <text x="1281" y="715" text-anchor="middle" class="pill">NOT AN AGENT</text>
  <text x="1360" y="748" text-anchor="middle" class="memoryTitle">Quality &amp; Safety Gate</text>
  <text x="1230" y="778" class="small">provenance · unsupported claims · uncertainty</text>
  <text x="1230" y="802" class="small">causal language · transferability · safety boundary</text>

  <!-- Output -->
  <line x1="1360" y1="825" x2="1360" y2="850" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1120" y="855" width="480" height="42" rx="16" fill="#0F172A"/>
  <text x="1360" y="882" text-anchor="middle" style="font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:#FFFFFF;">Validated Output → Research / Analysis / Report / Paper / Decision</text>

  <!-- Legend / principle -->
  <rect x="70" y="690" width="405" height="135" rx="20" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="95" y="724" class="memoryTitle">Design principle</text>
  <text x="95" y="754" class="memoryText">Create an autonomous agent only when it performs</text>
  <text x="95" y="780" class="memoryText">a distinct information-processing function.</text>
  <text x="95" y="810" class="small">Evidence-only tasks: 3 active agents · Data-analysis tasks: 4</text>
</svg>
